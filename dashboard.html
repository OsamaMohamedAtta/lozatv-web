<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LozaTV — My Player</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="./assets/logo.png">
</head>

<body class="dashboard-body">
  <header class="site-header">
    <a class="brand" href="index.html"><img src="./assets/logo.png" alt="logo"></a>
    <nav class="desktop-nav"><a href="index.html">Home</a><a href="contact.html">Contact</a></nav>
    <button id="logoutBtn" class="btn btn-ghost btn-small">Logout</button>
  </header>

  <main class="dashboard">
    <div id="loginView" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo"><img src="./assets/logo.png" alt="logo"></div>
        <span class="eyebrow">PLAYER ACCESS</span>
        <h1>Connect your <em>LozaTV</em></h1>
        <p>Enter the MAC address and device key assigned to your player.</p>
        <form id="loginForm">
          <label>MAC Address<input id="macAddress" required placeholder="00:11:22:33:44:55" autocomplete="off"></label>
          <label>Device Key<input id="deviceKey" required placeholder="Enter device key" autocomplete="off"></label>
          <button class="btn btn-primary full" type="submit">Login to Dashboard <span>→</span></button>
          <div id="loginError" class="form-message error"></div>
        </form>
      </div>
    </div>

    <div id="appView" class="hidden">
      <div class="dashboard-head">
        <div><span class="eyebrow">MY PLAYER</span>
          <h1>Welcome to your <em>dashboard.</em></h1>
          <p>Manage the playlists connected to your LozaTV player.</p>
        </div>
        <button id="openAdd" class="btn btn-primary">+ Add Playlist</button>
      </div>

      <div id="userInfo" class="account-banner"></div>
      <div id="playlistGrid" class="playlist-grid"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">+</div>
        <h2>No playlists yet</h2>
        <p>Add your first playlist to get started.</p><button class="btn btn-primary" id="emptyAdd">Add
          Playlist</button>
      </div>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close="modal"></div>
    <div class="modal-card">
      <button class="modal-close" data-close="modal">×</button>
      <span class="eyebrow" id="modalEyebrow">NEW PLAYLIST</span>
      <h2 id="modalTitle">Add playlist</h2>
      <form id="playlistForm">
        <input type="hidden" id="playlistId">
        <label>Playlist name<input id="playlistName" required placeholder="My Playlist"></label>
        <label>Playlist URL<input id="playlistUrl" required type="url"
            placeholder="https://example.com/playlist"></label>
        <label>Password <span class="optional">Optional</span><input id="playlistPassword" type="password"
            placeholder="Leave empty if not protected"></label>
        <div id="playlistMessage" class="form-message"></div>
        <button class="btn btn-primary full" type="submit" id="savePlaylist">Save Playlist</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <!-- whatsapp float icon -->

    aria-label="Contact us on WhatsApp">
